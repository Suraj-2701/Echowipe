<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Echowipe</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:white;
overflow:hidden;
}

/* Container */
.container{
text-align:center;
}

/* Logo */
.logo{
width:140px;
animation: logoPop 1.5s ease;
}

/* Logo Animation */
@keyframes logoPop{
0%{
transform:scale(0);
opacity:0;
}
60%{
transform:scale(1.2);
}
100%{
transform:scale(1);
opacity:1;
}
}

/* Title */
.title{
margin-top:20px;
font-size:42px;
font-weight:700;
background: linear-gradient(90deg,#2f80ed,#8e2de2);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation: fadeUp 1.8s ease;
}

/* Title animation */
@keyframes fadeUp{
0%{
opacity:0;
transform:translateY(40px);
}
100%{
opacity:1;
transform:translateY(0);
}
}

/* Loading dots */

.loading{
margin-top:25px;
display:flex;
justify-content:center;
gap:8px;
}

.dot{
width:10px;
height:10px;
background:#6c63ff;
border-radius:50%;
animation:bounce 1.4s infinite;
}

.dot:nth-child(2){
animation-delay:0.3s;
}

.dot:nth-child(3){
animation-delay:0.6s;
}

@keyframes bounce{
0%,80%,100%{
transform:scale(0);
}
40%{
transform:scale(1);
}
}

</style>
</head>

<body>

<div class="container">

<img src="{{ url_for('static', filename='MainLogo.png') }}" class="logo">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='MainLogo.png') }}">

<div class="title">Echowipe</div>

<div class="loading">
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

</div>

<script>

/* Redirect after loading */

setTimeout(function(){
window.location.href="/dashboard";
},4000)

</script>

</body>
</html>
