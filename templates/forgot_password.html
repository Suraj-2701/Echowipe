<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | EchoWipe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='MainLogo.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="card">
        <h2>Reset Password</h2>
        <p style="margin-bottom: 20px; font-size: 14px; color: #666;">Enter your email to receive a reset code.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="input-box">
                <i class="fa fa-envelope"></i>
                <input type="email" name="reset_email" placeholder="Enter your email" required>
            </div>
            <button type="submit">Send Reset Code</button>
        </form>

        <p class="switch">
            <a href="{{ url_for('index') }}" style="text-decoration: none; color: #7c4dff;">Back to Login</a>
        </p>
    </div>
</div>
</body>
</html>
