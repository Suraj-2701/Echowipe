<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Password | EchoWipe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='MainLogo.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="card">
        <h2>Set New Password</h2>
        <p style="margin-bottom: 20px; font-size: 14px; color: #666;">Setting password for: <b>{{ email }}</b></p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="input-box">
                <i class="fa fa-key"></i>
                <input type="text" name="otp_code" placeholder="6-Digit OTP Code" required>
            </div>
            <div class="input-box">
                <i class="fa fa-lock"></i>
                <input type="password" name="new_password" placeholder="New Password" required>
            </div>
            <div class="input-box">
                <i class="fa fa-lock"></i>
                <input type="password" name="confirm_password" placeholder="Confirm New Password" required>
            </div>
            <button type="submit">Update Password</button>
        </form>
    </div>
</div>
</body>
</html>
