<!DOCTYPE html>
<html>
<head>
<title>Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
font-family:'Poppins', sans-serif;
margin:0;
background:#ffffff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.profile-container{
width:380px;
background:white;
border-radius:15px;
padding:30px;
box-shadow:0 8px 20px rgba(0,0,0,0.1);
text-align:center;
}

.profile-letter{
width:120px;
height:120px;
border-radius:50%;
background:#4facfe;
color:white;
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
font-weight:600;
margin:0 auto 15px auto;
}

.name{
font-size:24px;
font-weight:600;
}

.email{
font-size:15px;
color:#666;
margin-bottom:25px;
}

.menu{
text-align:left;
}

.menu-item{
padding:14px;
font-size:16px;
border-radius:8px;
margin-bottom:10px;
background:#f7f7f7;
cursor:pointer;
}

.menu-item:hover{
background:#4facfe;
color:white;
}

.logout{
background:#ffe5e5;
color:#d00000;
font-weight:500;
}

</style>

</head>

<body>

<div class="profile-container">

<div class="profile-letter" id="profileLetter"></div>

<div class="name" id="username">Aditya Kale</div>
<div class="email">aditya@email.com</div>

<div class="menu">

<div class="menu-item">👤 Edit Profile</div>
<div class="menu-item">🔒 Change Password</div>

<a href="helpandsupport.html" style="text-decoration:none; color:black;">
<div class="menu-item">❓ Help & Support</div>
</a>

<div class="menu-item logout">⎋ Logout</div>

</div>

</div>

<script>

let username=document.getElementById("username").innerText;
document.getElementById("profileLetter").innerText=username.charAt(0).toUpperCase();

</script>

</body>
</html>
